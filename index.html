<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 RGB Legacy Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Courier New', monospace;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* --- Efeito de scanline (legacy) --- */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, 
        rgba(0,0,0,0.15) 0px, 
        rgba(0,0,0,0.15) 2px, 
        transparent 2px, 
        transparent 6px);
      pointer-events: none;
      z-index: 999;
      animation: scanMove 8s linear infinite;
    }

    @keyframes scanMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 10px; }
    }

    /* --- Container principal com borda RGB legacy --- */
    .rgb-legacy-border {
      position: relative;
      background: #0d0d0d;
      border-radius: 20px;
      padding: 8px;
      box-shadow: 
        0 0 20px rgba(255, 0, 0, 0.3),
        0 0 40px rgba(0, 255, 0, 0.2),
        0 0 60px rgba(0, 0, 255, 0.2),
        inset 0 0 30px rgba(255, 255, 255, 0.05);
      animation: borderGlow 3s ease-in-out infinite alternate;
    }

    .rgb-legacy-border::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      padding: 4px;
      background: conic-gradient(from 0deg, 
        #ff0000, #ff7700, #ffff00, #00ff00, 
        #0077ff, #8800ff, #ff00ff, #ff0000);
      background-size: 400% 400%;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rgbRotate 8s linear infinite;
      z-index: -1;
    }

    /* Borda secundária (efeito legacy double-border) */
    .rgb-legacy-border::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 28px;
      border: 2px dashed rgba(255, 255, 255, 0.1);
      animation: dashSpin 20s linear infinite;
      z-index: -2;
    }

    @keyframes rgbRotate {
      0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
      100% { background-position: 200% 50%; filter: hue-rotate(360deg); }
    }

    @keyframes borderGlow {
      0% { 
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), 0 0 40px rgba(0, 255, 0, 0.2);
      }
      33% { 
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.4), 0 0 40px rgba(0, 0, 255, 0.2);
      }
      66% { 
        box-shadow: 0 0 20px rgba(0, 0, 255, 0.4), 0 0 40px rgba(255, 0, 255, 0.2);
      }
      100% { 
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.4), 0 0 40px rgba(255, 200, 0, 0.2);
      }
    }

    @keyframes dashSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* --- Card principal estilo legacy --- */
    .player-card {
      background: #111;
      border-radius: 16px;
      padding: 2rem 2rem 2.5rem;
      color: #e0e0e0;
      text-align: center;
      max-width: 800px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    /* Efeito de cintilação legacy */
    .player-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, 
        rgba(255,255,255,0.03) 0%, 
        transparent 60%);
      animation: shimmer 10s linear infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { transform: translate(-10%, -10%) rotate(0deg); }
      100% { transform: translate(10%, 10%) rotate(360deg); }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, 
        #ff0040, #ff8000, #ffff00, #00ff80, 
        #0080ff, #8000ff, #ff0080);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textRainbow 4s linear infinite;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 30px rgba(255,255,255,0.1);
      font-family: 'Courier New', monospace;
    }

    @keyframes textRainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .subtitle {
      color: #888;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      letter-spacing: 3px;
      border-bottom: 2px solid #222;
      padding-bottom: 0.75rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
    }

    .subtitle span {
      display: inline-block;
      animation: blink 1.2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* --- Grid de músicas com bordas RGB individuais --- */
    .music-grid {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin: 2rem 0;
      position: relative;
      z-index: 1;
    }

    .music-item {
      position: relative;
      background: #161616;
      border-radius: 16px;
      padding: 1.2rem 1.5rem 1.5rem;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    /* Borda RGB individual para cada música (efeito legacy) */
    .music-item::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 18px;
      padding: 3px;
      background: linear-gradient(45deg, 
        #ff0000, #ff8800, #ffff00, #00ff00, 
        #0088ff, #8800ff, #ff00ff);
      background-size: 400% 400%;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderRainbow 4s linear infinite;
      z-index: -1;
      opacity: 0.8;
    }

    /* Segunda borda (efeito legacy glow) */
    .music-item::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      animation: pulseBorder 2s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes borderRainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    @keyframes pulseBorder {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }

    .music-item:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 0 40px rgba(255, 100, 200, 0.2);
    }

    .music-item:hover::before {
      opacity: 1;
      animation-duration: 2s;
    }

    .music-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #eee;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .music-title i {
      font-size: 1.4rem;
      color: #ff3366;
      filter: drop-shadow(0 0 10px rgba(255, 51, 102, 0.3));
      animation: iconPulse 2s ease-in-out infinite;
    }

    .music-item:nth-child(2) .music-title i {
      color: #33ccff;
      filter: drop-shadow(0 0 10px rgba(51, 204, 255, 0.3));
    }

    .music-item:nth-child(3) .music-title i {
      color: #ff66cc;
      filter: drop-shadow(0 0 10px rgba(255, 102, 204, 0.3));
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .music-title .track-num {
      display: inline-block;
      background: rgba(255,255,255,0.05);
      padding: 0.1rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #888;
      border: 1px solid #333;
      font-family: 'Courier New', monospace;
    }

    iframe {
      width: 100%;
      height: 80px;
      border-radius: 40px;
      border: 1px solid #222;
      background: #000;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      transition: all 0.3s ease;
    }

    iframe:hover {
      border-color: #ff3366;
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.2), inset 0 0 20px rgba(0,0,0,0.9);
    }

    .music-item:nth-child(2) iframe:hover {
      border-color: #33ccff;
      box-shadow: 0 0 30px rgba(51, 204, 255, 0.2);
    }

    .music-item:nth-child(3) iframe:hover {
      border-color: #ff66cc;
      box-shadow: 0 0 30px rgba(255, 102, 204, 0.2);
    }

    /* --- Rodapé estilo legacy --- */
    .footer-legacy {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #666;
      font-family: 'Courier New', monospace;
      border-top: 1px solid #1a1a1a;
      padding-top: 1.5rem;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .rgb-indicator {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .rgb-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      animation: ledBlink 1.5s ease-in-out infinite alternate;
      box-shadow: 0 0 10px currentColor;
    }

    .rgb-led.red { background: #ff0033; color: #ff0033; animation-delay: 0s; }
    .rgb-led.green { background: #00ff33; color: #00ff33; animation-delay: 0.5s; }
    .rgb-led.blue { background: #0033ff; color: #0033ff; animation-delay: 1s; }

    @keyframes ledBlink {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .legacy-text {
      color: #444;
      font-size: 0.7rem;
      letter-spacing: 4px;
    }

    .legacy-text span {
      color: #ff3366;
      animation: blink 1.2s step-end infinite;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .player-card { padding: 1.5rem; }
      h1 { font-size: 1.8rem; }
      .music-title { font-size: 0.9rem; flex-wrap: wrap; }
      .music-item { padding: 1rem; }
      .footer-legacy { gap: 1rem; flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="rgb-legacy-border">
    <div class="player-card">

      <h1>◈ RGB LEGACY ◈</h1>
      <div class="subtitle">
        <span>✦</span> neon retrô • 3 tracks <span>✦</span>
      </div>

      <div class="music-grid">
        <!-- Música 1 -->
        <div class="music-item">
          <div class="music-title">
            <i>♫</i>
            <span>Track 01</span>
            <span class="track-num">#FF0033</span>
          </div>
          <iframe 
            src="https://www.youtube.com/embed/42kI2lT0x6U?autoplay=0&mute=0&controls=1&loop=0&rel=0&modestbranding=1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <!-- Música 2 -->
        <div class="music-item">
          <div class="music-title">
            <i>♫</i>
            <span>Track 02</span>
            <span class="track-num">#33CCFF</span>
          </div>
          <iframe 
            src="https://www.youtube.com/embed/KK3KXAECte4?autoplay=0&mute=0&controls=1&loop=0&rel=0&modestbranding=1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <!-- Música 3 -->
        <div class="music-item">
          <div class="music-title">
            <i>♫</i>
            <span>Track 03</span>
            <span class="track-num">#FF66CC</span>
          </div>
          <iframe 
            src="https://www.youtube.com/embed/gCS3ow7lSZA?autoplay=0&mute=0&controls=1&loop=0&rel=0&modestbranding=1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

          </iframe>
        </div>
      </div>

      <div class="footer-legacy">
        <div class="rgb-indicator">
          <span class="rgb-led red"></span>
          <span class="rgb-led green"></span>
          <span class="rgb-led blue"></span>
          <span style="color:#888; margin-left: 6px;">RGB MODE</span>
        </div>
        <span class="legacy-text">❚❚❚❚❚ <span>▶</span> ❚❚❚❚❚</span>
        <span style="color:#444; font-size:0.7rem;">✦ legacy visual ✦</span>
      </div>

    </div>
  </div>

</body>
</html>
